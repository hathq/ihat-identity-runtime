[package]
readme = "README.md"
repository = "https://github.com/hathq/ihat-identity-runtime"
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "ihat-identity-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Durable owner-local identity authority runtime"
license = "Apache-2.0"
publish = ["crates-io"]

[lib]
path = "src/lib.rs"

[dependencies]
getrandom = "=0.3.4"
ihat-identity-assertion-contracts = { version = "=0.10.0" }
libc = "=0.2.187"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
